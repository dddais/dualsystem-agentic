# Intermediate version: click start/stop/home in /manual to send bridge commands.
robot:
  type: x1pro
  driver: manual_bridge
  operator_timeout_s: 300.0
  scheduler_url: ws://127.0.0.1:8088
  robot_url: ws://127.0.0.1:9946
  timeout_s: 5.0
  start_delay_s: 0.5
  stop_delay_s: 1.0
  reset_delay_s: 8.0
  # Empty map: require an exact match against scheduler status.prompts.
  # Optional aliases map the loop instruction to a prompt index or text:
  # prompt_map:
  #   pick the carrot and put it on yellow plate: 0
  prompt_map: {}

camera:
  provider: robot_bridge
  # robot_url defaults to robot.robot_url; this is an independent connection.
  timeout_s: 5.0
  cache_s: 0.5
  snapshot_ttl_s: 30.0
  max_obs_lag_s: 3.0
  quality: 90

monitor:
  provider: remote_http
  url: http://127.0.0.1:18877  # Same SSH forward as manual.runtime.yaml; adjust for your GRM.
  timeout: 30.0

safety:
  monitor_ready_timeout_s: 30.0
  max_execution_s: 300.0
