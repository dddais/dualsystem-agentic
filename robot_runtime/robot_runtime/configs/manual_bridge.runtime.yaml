# Intermediate version: click start/stop/home in /manual to send bridge commands.
robot:
  type: x1pro
  driver: manual_bridge
  operator_timeout_s: 300.0
  scheduler_url: ws://192.168.10.3:8088
  # scheduler_url: ws://192.168.31.118:8088
  robot_url: ws://127.0.0.1:9946
  timeout_s: 5.0
  start_delay_s: 0.5
  stop_delay_s: 1.0
  reset_delay_s: 8.0
  # Send the same literal instruction to VLA and VLM; requires updated Scheduler.
  prompt_mode: text
  # Used only by legacy fixed-prompt executions; web tasks always use text.
  prompt_map: {}

camera:
  provider: robot_bridge
  # robot_url defaults to robot.robot_url; this is an independent connection.
  timeout_s: 5.0
  cache_s: 0.5
  snapshot_ttl_s: 30.0
  max_obs_lag_s: 3.0
  quality: 90

monitor:
  provider: remote_http
  url: http://127.0.0.1:18877  # Same SSH forward as manual.runtime.yaml; adjust for your GRM.
  timeout: 30.0

safety:
  monitor_ready_timeout_s: 30.0
  max_execution_s: 300.0
