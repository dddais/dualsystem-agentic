executor:
  provider: noop

mcp:
  provider: sdk
  servers:
    - namespace: dual_franka
      description: Dual-Franka runtime tools exposed as dual_franka___<tool_name>.
      transport: stdio
      command: python
      args: ["mcp_server/dual_franka_mcp_server/server.py"]
      env:
        DUAL_FRANKA_RUNTIME_URL: http://192.168.121.167:8767
        # Keep fetch_env hidden unless a real structured scene-graph provider is connected.
        # Images already arrive through HTTPDataLoader; exposing fetch_env with only runtime
        # bookkeeping can make the VLM repeatedly observe instead of executing.
        # DUAL_FRANKA_FETCH_ENV_HTTP: "true"
        # DUAL_FRANKA_FETCH_ENV_PATH: /environment
        DUAL_FRANKA_MONITOR_PATH: /monitors/status
        DUAL_FRANKA_EXECUTE_PATH: /executions
        DUAL_FRANKA_STOP_PATH: /control/stop
        DUAL_FRANKA_RESET_PATH: /control/reset
        # Keep reset_task hidden until robot-side reset behavior is implemented and safe.
        # DUAL_FRANKA_ENABLE_RESET: "true"
        DUAL_FRANKA_ESTOP_PATH: /control/emergency_stop
        DUAL_FRANKA_TIMEOUT_S: 30.0
        DUAL_FRANKA_UNKNOWN_STATUS: running

loop:
  max_steps: 20
  reason_interval_s: 1000.0
  monitor_poll_interval_s: 1.0
  max_monitor_polls: 300
  include_metadata_in_prompt: false

dataloader:
  provider: http
  url: http://192.168.121.167:8767/observations/latest
  timeout: 10.0
  image_key: concatenated_image
  label: main

interaction:
  provider: console
  show_raw_json: false

logging:
  enabled: true
  root_dir: runs
  save_images: true
