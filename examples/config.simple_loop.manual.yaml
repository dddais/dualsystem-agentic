# Allow choosing Back, its execution, another operator wait and teleop adjustment.
mcp:
  provider: sdk
  servers:
    - namespace: dual_franka
      transport: stdio
      command: python
      args: ["mcp_server/dual_franka_mcp_server/server.py"]
      env:
        DUAL_FRANKA_RUNTIME_URL: ${DUAL_FRANKA_RUNTIME_URL}
        DUAL_FRANKA_ENABLE_RESET: "true"
        DUAL_FRANKA_UNKNOWN_STATUS: failed
        DUAL_FRANKA_TIMEOUT_S: 1320.0

loop:
  monitor_poll_interval_s: 1.0

simple_loop:
  # manual_bridge: optional Back, then Homing or teleoperation adjustment.
  # Original manual falls back to its existing manual reset confirmation.
  recover_tool: recover_task
  input_source: web
  instruction_template: "pick the {target} and put it into the box"
  # Additional templates shown in /manual; each contains only {target}.
  instruction_templates:
    放到杯子里: "pick the {target} and put it into the cup"
    放到盒子里: "pick the {target} and put it into the box"
  default_target: null
  first_result_timeout_s: 120.0
  result_timeout_s: 120.0
  max_execution_s: 300.0
  # Follow Monitor's on_missing_bbox: baseline fallback; warn on degraded frames.
  # Set true only when every scored frame must apply attention steering.
  require_steering: false
